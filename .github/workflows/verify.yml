name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: test -z "$(gofmt -l . | grep -v '^old/')" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build -o bin/orc ./cmd/orc
      - run: go test ./...
      - run: go test -race ./...
      # Product acceptance (HTTP); browser e2e skips without Chrome.
      - run: go test ./internal/api/ -run 'TestExampleCase|TestCancelOverHTTP|TestCrossTenant|TestRoleMatrix' -v
      - run: ./bin/orc serve --addr 127.0.0.1:8099 --data /tmp/pl & sleep 2; curl -fsS http://127.0.0.1:8099/health
