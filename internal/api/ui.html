<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proofline</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16181d;--muted:#5d6470;--line:#dfe3e8;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--ok:#1f6f43;--ok-bg:#f1f7f3;--warn:#8a5a00;--warn-bg:#fff3d6;--bad:#a11d1d;--bad-bg:#fde8e8;--blk:#5b1f8f;--blk-bg:#f1e8fb;--info:#1d4f8a;--info-bg:#e8f0fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--info)}code,pre,.mono{font-family:var(--mono);font-size:12.5px}
nav.top{background:#15181e;color:#e6e8ee;padding:0 24px;display:flex;align-items:center;gap:22px;height:46px;position:sticky;top:0;z-index:5}
nav.top .brand{font-weight:700;letter-spacing:.06em;color:#fff;text-decoration:none}nav.top a{color:#c9cdd6;text-decoration:none;font-size:13px}nav.top a.on{color:#fff;border-bottom:2px solid #fff;padding-bottom:13px;margin-bottom:-15px}
nav.top .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px}
.modebadge{padding:2px 8px;border-radius:4px;font-weight:700;font-size:11px;letter-spacing:.05em}.m-unsafe{background:#5a1616;color:#ffd9d9}.m-safe{background:#174a2b;color:#d3f2df}
.wrap{max-width:1100px;margin:0 auto;padding:20px 24px 80px}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:10px}.crumbs a{color:var(--muted)}
h1.page{font-size:20px;margin:0 0 12px}.goal{font-size:21px;font-weight:600;margin:4px 0 2px;line-height:1.3}
.meta{color:var(--muted);font-size:12.5px}.meta code{color:var(--ink)}
.band{border-radius:8px;padding:16px 18px;margin:14px 0;display:flex;gap:18px;align-items:flex-start;border:1px solid transparent}
.band .v{font-size:26px;font-weight:700;letter-spacing:.02em;white-space:nowrap;min-width:190px}.band .why{font-size:14px}.band .stats{opacity:.9;font-size:12.5px;margin-top:4px}
.s-supported{background:var(--ok-bg);color:var(--ok);border-color:#cfe3d6}.s-insufficient{background:var(--warn-bg);color:var(--warn);border-color:#f2d58a}
.s-contradicted,.s-blocked{background:var(--bad-bg);color:var(--bad);border-color:#f0b4b4}.s-running,.s-pending,.s-interrupted{background:var(--info-bg);color:var(--info);border-color:#b9cdea}.s-stale{background:var(--blk-bg);color:var(--blk);border-color:#d3bdea}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}
.panel h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.badge{display:inline-block;min-width:104px;text-align:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.b-supported{background:#e3efe7;color:var(--ok)}.b-insufficient{background:var(--warn-bg);color:var(--warn)}.b-contradicted,.b-blocked,.b-failed{background:var(--bad-bg);color:var(--bad)}.b-stale{background:var(--blk-bg);color:var(--blk)}
.b-running,.b-pending,.b-understanding,.b-implementing,.b-verifying,.b-reviewing,.b-investigating{background:var(--info-bg);color:var(--info)}.b-awaiting_decision{background:var(--warn-bg);color:var(--warn)}.b-done{background:#eef0f3;color:var(--muted)}.b-interrupted{background:var(--blk-bg);color:var(--blk)}
.claim{border-top:1px solid var(--line);padding:10px 0}.claim:first-of-type{border-top:0}
.claim .row{display:grid;grid-template-columns:112px 190px 1fr 24px;gap:12px;align-items:start;cursor:pointer}
.claim .title{font-weight:600}.claim .core{font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
.claim .reason{color:var(--muted);font-size:12.5px;margin-top:2px}.claim .gap{color:var(--warn);font-size:12.5px;margin-top:2px}
.claim.insufficient .gap{font-weight:600}.claim.contradicted .stmt,.claim.blocked .stmt{color:var(--bad);font-weight:600}.claim.stale .stmt{color:var(--blk);font-weight:600}
.policy{color:var(--muted);font-size:11.5px;margin-top:4px;font-style:italic}
.chev{color:var(--muted);text-align:right}.ev{margin:10px 0 0 124px;border-left:3px solid var(--line);padding-left:12px}
.art{margin:8px 0;padding:8px 10px;background:#fafbfc;border:1px solid var(--line);border-radius:6px}
.art .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:12.5px}.art .h b{font-size:13px}.art .id{color:var(--muted);font-family:var(--mono);font-size:11px}
.prov{color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-top:3px}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
.tc{display:inline-block;margin:1px 4px 1px 0;padding:0 5px;border-radius:3px;font-family:var(--mono);font-size:11px;background:#eef0f3}.tc.fail{background:var(--bad-bg);color:var(--bad)}.tc.skip{background:var(--warn-bg);color:var(--warn)}.tc.pass{color:var(--ok)}
pre{background:#0f1116;color:#e6e8ee;padding:10px;border-radius:6px;overflow:auto;max-height:360px;margin:8px 0 0;white-space:pre-wrap;word-break:break-word}
details>summary{cursor:pointer;color:var(--info);font-size:12.5px;user-select:none}
ul.list{margin:4px 0;padding-left:20px}ul.list li{margin:2px 0}
.gaps{background:var(--warn-bg);border-color:#f2d58a}.gaps h2{color:var(--warn)}.gaps li{font-weight:600;color:var(--warn)}
.contra{background:var(--bad-bg);border-color:#f0b4b4}.contra h2{color:var(--bad)}.contra li{font-weight:600;color:var(--bad)}
.warnbox{background:var(--blk-bg);color:var(--blk);border:1px solid #d3bdea;border-radius:6px;padding:8px 10px;margin:6px 0;font-weight:600}
.notice{background:var(--info-bg);color:var(--info);border:1px solid #b9cdea;border-radius:6px;padding:8px 10px;margin:6px 0}
.unsafe{background:#fde8e8;color:var(--bad);border:1px solid #f0b4b4;border-radius:6px;padding:8px 10px;margin:6px 0;font-size:12.5px}
.risk{display:grid;grid-template-columns:70px 190px 1fr;gap:10px;padding:5px 0;border-top:1px solid var(--line)}.risk:first-of-type{border-top:0}
.sev{font-weight:700;font-size:11px;text-transform:uppercase}.sev-high{color:var(--bad)}.sev-medium{color:var(--warn)}.sev-low,.sev-unknown{color:var(--muted)}.src{color:var(--muted);font-size:12px}
.decide{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.decide textarea,textarea,input[type=text],select{border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;width:100%}.decide textarea{flex:1 1 320px;min-height:56px}
button{font:inherit;font-weight:600;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}button.primary{background:#15181e;color:#fff;border-color:#15181e}
button:disabled{opacity:.5;cursor:not-allowed}.accept{border-color:var(--ok);color:var(--ok)}.request{border-color:var(--warn);color:var(--warn)}.reject{border-color:var(--bad);color:var(--bad)}
.recorded{padding:8px 10px;border-radius:6px;background:#f2f4f7;margin:6px 0}.recorded b{text-transform:uppercase}
.tabs{display:flex;gap:4px;margin-top:16px}.tabs a{padding:8px 14px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:#eef0f3;color:var(--ink);text-decoration:none;font-weight:500}.tabs a.on{background:var(--panel);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;border-top:0}
.files code{display:inline-block;margin:2px 6px 2px 0}.tf{color:var(--warn)}
.err{background:var(--bad-bg);color:var(--bad);padding:10px;border-radius:6px}.hidden{display:none}.small{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.claim .row{grid-template-columns:100px 1fr 24px}.claim .title{grid-column:2}.claim .row>span:nth-child(3){grid-column:1/3}.ev{margin-left:0}}
.caserow{display:grid;grid-template-columns:120px 1fr 150px 110px;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}.caserow:first-of-type{border-top:0}.caserow a{font-weight:600;color:inherit;text-decoration:none}
.field{margin:10px 0}.field label{display:block;font-weight:600;font-size:12.5px;margin-bottom:4px}.field .hint{font-size:12px;color:var(--muted);margin-top:3px}
.radio label{display:inline-flex;gap:6px;align-items:center;margin-right:16px;font-weight:500}
.phase{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.phase span{padding:3px 10px;border-radius:12px;background:#eef0f3;font-size:12px}.phase span.done{background:#e3efe7;color:var(--ok)}.phase span.now{background:var(--info-bg);color:var(--info);font-weight:700}.phase span.bad{background:var(--bad-bg);color:var(--bad)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl .it{position:relative;padding:4px 0 8px}.tl .it:before{content:"";position:absolute;left:-19px;top:9px;width:8px;height:8px;border-radius:50%;background:#c9cdd6}.tl .it.bad:before{background:var(--bad)}.tl .it.ok:before{background:var(--ok)}.tl .t{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.legend{font-size:12px;color:var(--muted);margin-top:8px}.legend span{margin-right:12px}
.stat{display:inline-block;margin-right:18px}.stat b{font-size:20px;display:block}.stat span{font-size:12px;color:var(--muted)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--info);margin-right:6px;animation:p 1.2s infinite}@keyframes p{50%{opacity:.3}}
</style>
</head>
<body>
<nav class="top"><a class="brand" href="/">PROOFLINE</a><a href="/" data-nav="/">Cases</a><a href="/new" data-nav="/new">New change case</a><a href="/repos-ui" data-nav="/repos-ui">Repositories &amp; settings</a><a href="/help" data-nav="/help">Help</a><a href="/audit-ui" data-nav="/audit-ui">Audit</a><div class="right" id="sysbadge"></div></nav>
<div class="wrap" id="app"><div class="small">loading…</div></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMs=ms=>ms>=60000?(ms/60000).toFixed(1)+' min':ms>=1000?(ms/1000).toFixed(1)+' s':ms+' ms';
const ago=t=>{if(!t)return '';const d=(Date.now()-new Date(t))/1000;return d<60?Math.round(d)+'s ago':d<3600?Math.round(d/60)+'m ago':d<86400?Math.round(d/3600)+'h ago':new Date(t).toLocaleString()};
const ACTIVE=new Set(['pending','understanding','investigating','implementing','verifying','reviewing']);
const PHASES=['pending','understanding','implementing','verifying','reviewing','done'];
const open={};let timer=null;let SYS=null;
let TOKEN='';try{TOKEN=localStorage.getItem('proofline_token')||''}catch(e){}
async function api(path,opt){opt=opt||{};opt.headers=Object.assign({},opt.headers||{});if(TOKEN)opt.headers['Authorization']='Bearer '+TOKEN;const r=await fetch(path,opt);let j={};try{j=await r.json()}catch(e){}if(r.status===401){showLogin();throw Object.assign(new Error('unauthenticated — enter your token'),{status:401})}if(!r.ok)throw Object.assign(new Error(j.error||r.statusText),{status:r.status});return j}
function showLogin(){$('#app').innerHTML=`<div class="panel" style="max-width:520px;margin:40px auto"><h2>Sign in</h2><p class="small">This instance has authentication configured. Paste the token issued by <code>orc auth init</code> / <code>orc auth add-user</code>. It is kept in this browser only and sent as a bearer header; it never appears in cases, events or packets.</p><form onsubmit="TOKEN=this.tok.value.trim();try{localStorage.setItem('proofline_token',TOKEN)}catch(e){};SYS=null;route();return false"><input type="text" name="tok" placeholder="plt_…" autofocus><div style="margin-top:8px"><button class="primary" type="submit">Continue</button></div></form></div>`}
function signOut(){TOKEN='';try{localStorage.removeItem('proofline_token')}catch(e){};SYS=null;route()}
function go(path){history.pushState({},'',path);route()}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="/"]');if(a&&!a.target&&!a.hasAttribute('download')&&!a.href.includes('/tasks/')){e.preventDefault();go(a.getAttribute('href'))}});
window.addEventListener('popstate',route);

let ME=null;
async function loadSys(){try{SYS=await api('/system');ME=await api('/whoami')}catch(e){if(e.status===401)throw e;SYS=null}
  const b=$('#sysbadge');if(!SYS){b.innerHTML=`<span class="modebadge m-unsafe">API UNREACHABLE</span>`;return}
  const who=ME?(ME.local_mode?'local mode':esc(ME.name)+' · '+Object.entries(ME.roles||{}).map(([w,r])=>esc(r)).join(',')+' <a href="#" onclick="signOut();return false" style="color:#c9cdd6">sign out</a>'):'';
  b.innerHTML=`<span class="modebadge ${SYS.exec_mode==='SAFE_SANDBOX'?'m-safe':'m-unsafe'}" title="${esc(SYS.warning||'OS sandbox enforced')}">${esc(SYS.exec_mode)}</span><span>${SYS.github_connected?'GitHub connected':'GitHub not connected'}</span><span>${who}</span>`}

async function route(){
  clearTimeout(timer);const path=location.pathname;
  document.querySelectorAll('nav.top a[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===path||(a.dataset.nav==='/'&&path.startsWith('/cases/'))));
  if(!SYS)await loadSys();
  let m;
  try{
    if(path==='/')return await overview();
    if(path==='/new')return await newCase();
    if(path==='/repos-ui')return await reposPage();
    if(path==='/help')return help();
    if(path==='/audit-ui')return await auditPage();
    if(m=path.match(/^\/cases\/([^/]+)(?:\/(packet|timeline|history|raw))?$/))return await casePage(m[1],m[2]||'');
    $('#app').innerHTML='<div class="err">not found</div>';
  }catch(e){$('#app').innerHTML=`<div class="err">${esc(e.message)}</div>`}
}
const unsafeBox=()=>SYS&&SYS.exec_mode!=='SAFE_SANDBOX'?`<div class="unsafe"><b>${esc(SYS.exec_mode)}</b> — ${esc(SYS.warning)}. Fine for the Local Pilot on your own machine; never expose this instance to untrusted repositories.</div>`:'';

// ---------- Overview ----------
async function overview(){
  const tasks=(await api('/tasks')).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const packets=await Promise.all(tasks.map(t=>api('/tasks/'+t.id+'/packet').catch(()=>null)));
  const rows=tasks.map((t,i)=>({t,v:packets[i]}));
  const needs=rows.filter(r=>r.v&&!ACTIVE.has(r.t.status)&&(r.t.status==='awaiting_decision'||(r.v.verdicts||[]).length===0&&r.t.status!=='pending'));
  const running=rows.filter(r=>ACTIVE.has(r.t.status));
  const problem=rows.filter(r=>r.v&&['blocked','contradicted','stale'].includes(r.v.packet.verdict));
  const ex=SYS&&SYS.examples_enabled?await api('/examples').catch(()=>null):null;
  const filter=new URLSearchParams(location.search).get('f')||'';
  const shown=rows.filter(r=>!filter||r.t.status===filter||(r.v&&r.v.packet.verdict===filter));
  $('#app').innerHTML=`<h1 class="page">Change cases</h1>${unsafeBox()}
  <div class="panel"><span class="stat"><b>${rows.length}</b><span>cases</span></span><span class="stat"><b>${running.length}</b><span>running</span></span><span class="stat"><b style="color:var(--warn)">${needs.length}</b><span>need your decision</span></span><span class="stat"><b style="color:var(--bad)">${problem.length}</b><span>blocked / contradicted / stale</span></span>
  <div style="float:right"><a href="/new"><button class="primary">New change case</button></a></div></div>
  ${needs.length?`<div class="panel gaps"><h2>Waiting for a human decision</h2>${needs.map(r=>caseRow(r)).join('')}</div>`:''}
  <div class="panel"><h2>All cases <span class="small">filter: <select onchange="go('/?f='+this.value)"><option value="">all</option>${['supported','insufficient','stale','blocked','done','awaiting_decision','failed','interrupted','verifying','implementing'].map(f=>`<option ${filter===f?'selected':''}>${f}</option>`).join('')}</select></span></h2>
  ${shown.length?shown.map(r=>caseRow(r)).join(''):`<div class="small">No cases yet. Create one, or load a Local Pilot example below — it runs the real engine on a real bug.</div>`}</div>
  ${ex?`<div class="panel"><h2>Local Pilot examples (real engine · scripted agents)</h2><div class="small" style="margin-bottom:8px">${esc(ex.note)}</div>${ex.scenarios.map(s=>`<div class="caserow"><span class="badge b-${s.expected.toLowerCase()}">${s.expected}</span><span><b>${esc(s.title)}</b><div class="small">${esc(s.summary)}</div></span><span></span><button onclick="loadExample('${s.name}')">Load example</button></div>`).join('')}</div>`:''}`;
}
function caseRow(r){const t=r.t,p=r.v?r.v.packet:null;const st=ACTIVE.has(t.status)?'running':t.status;
  const verdict=p?(ACTIVE.has(t.status)?'<span class="badge b-running">running</span>':`<span class="badge b-${p.verdict}">${p.verdict}</span>`):'';
  const dec=r.v&&r.v.verdicts&&r.v.verdicts.length?`<span class="small">decision: <b>${esc(r.v.verdicts[r.v.verdicts.length-1].decision.replace('_',' '))}</b></span>`:(t.status==='awaiting_decision'?'<span class="small" style="color:var(--warn)">engine question</span>':'<span class="small" style="color:var(--warn)">no decision</span>');
  return `<div class="caserow">${verdict}<span><a href="/cases/${t.id}">${esc(t.goal)}</a><div class="small mono">${t.id} · ${t.kind||'change'}${t.scenario?' · <b>example: '+esc(t.scenario)+'</b>':''}${t.pr?' · PR #'+t.pr.number:''} · ${esc(t.repos.map(x=>x.name).join(', '))}</div></span><span><span class="badge b-${st}">${st}</span><div class="small">${ago(t.updated_at)}</div></span>${dec}</div>`}
async function loadExample(name){try{const t=await api('/examples/'+name,{method:'POST'});go('/cases/'+t.id+'/timeline')}catch(e){alert(e.message)}}

// ---------- New case ----------
async function newCase(){
  const repos=await api('/repos').catch(()=>[]);const gh=SYS&&SYS.github_connected;
  $('#app').innerHTML=`<div class="crumbs"><a href="/">Cases</a> › New change case</div><h1 class="page">New change case</h1>${unsafeBox()}
  <form class="panel" onsubmit="return submitCase(event)">
    <div class="field"><label>Source</label><div class="radio"><label><input type="radio" name="src" value="local" checked onchange="srcChange()"> Local Pilot — repository on this machine</label><label><input type="radio" name="src" value="github" ${gh?'':'disabled'} onchange="srcChange()"> GitHub pull request ${gh?'':'<span class="small">(integration not connected)</span>'}</label></div>
      ${gh?'':'<div class="notice">GitHub integration not connected: set <code>GITHUB_TOKEN</code>, <code>PROOFLINE_GITHUB_WEBHOOK_SECRET</code> and link a repository with <code>orc repo add --github owner/name</code>. Nothing here simulates a connection.</div>'}</div>
    <div id="localsrc"><div class="field"><label>Repository</label><select name="repo">${repos.map(r=>`<option value="${r.id}">${esc(r.name)} — ${esc(r.path)}${r.github?' ('+esc(r.github)+')':''}</option>`).join('')}<option value="__path">register a local path…</option></select><div class="hint">${repos.length?'':'No repositories registered yet. '}Repositories are registered by ID; ${SYS&&SYS.exec_mode==='SAFE_SANDBOX'?'SAFE_SANDBOX accepts registered IDs under PROOFLINE_REPOS_ROOT only.':'in LOCAL_UNSAFE you may register any local git repository.'}</div>
      <input type="text" name="repopath" placeholder="/absolute/path/to/git/repo" style="margin-top:6px" ${repos.length?'class="hidden"':''}></div></div>
    <div id="ghsrc" class="hidden"><div class="field"><label>Pull request</label><div class="grid"><input type="text" name="owner" placeholder="owner"><input type="text" name="prrepo" placeholder="repository"></div><input type="text" name="prnum" placeholder="PR number" style="margin-top:6px"><div class="hint">Imports base/head SHA; verification runs on the exact head. A new push creates a new case; the old packet stays bound to its SHA.</div></div></div>
    <div class="field"><label>What should change?</label><input type="text" name="goal" required placeholder="e.g. Fix duplicate reservation across timezones"><div class="hint">This is the intent the agents work against and the packet is titled with.</div></div>
    <div class="field"><label>Expected behaviour / acceptance criteria</label><textarea name="context" rows="3" placeholder="One criterion per line. These become context for every role and show on the case."></textarea></div>
    <div class="field"><label>Change type</label><div class="radio"><label><input type="radio" name="kind" value="bugfix" checked> Bug fix — baseline must fail before the change</label><label><input type="radio" name="kind" value="change"> Behaviour change — baseline is informational</label></div></div>
    <div class="field"><label>Reproduction command <span class="small">(local pilot only)</span></label><input type="text" name="repro" placeholder="go test -run TestX ./..."><div class="hint" style="color:var(--warn)">Runs on the unchanged code first and again after the change. Argv only, allow-listed runners (go, npm, pytest, make…); no shell. Without it, "Problem reproduced" stays INSUFFICIENT.</div></div>
    <div class="field"><label>Existing change to verify <span class="small">(optional — verify-only mode)</span></label><input type="text" name="head" placeholder="branch, tag or SHA in the repository"><div class="hint">If set, no agent writes code: the baseline runs on HEAD, then this ref is tested and challenged.</div></div>

function renderPacket(v){const p=v.packet,t=v.task,arts=Object.fromEntries(v.artifacts.map(a=>[a.id,a]));const active=ACTIVE.has(t.status);const lastV=v.verdicts[v.verdicts.length-1];

function renderClaim(c,arts){const isOpen=!!open['c-'+c.type];

function renderArt(a){if(!a)return '<div class="small">artifact missing</div>';

    case 'diff':return `<div class="art">${head}<div class="files" style="margin-top:4px">${(a.files||[]).map(f=>`<code>${esc(f)}</code>`).join('')}</div><div class="small">commits ${a.commits?Object.entries(a.commits).map(([r,s])=>r+'@'+s.slice(0,10)).join(', '):'none'} · author ${esc(a.model||'?')}</div><details><summary>diff (${(a.diff||'').length} chars)</summary><pre>${esc(a.diff)}</pre></details></div>`;
    case 'review':return `<div class="art">${head}<div style="margin-top:4px">verdict <b>${esc(a.verdict)}</b> · model <code>${esc(a.model||'?')}</code> · author reasoning withheld</div><div class="small" style="margin-top:4px">${esc(a.summary)}</div>
      ${(a.findings||[]).length?`<div style="margin-top:6px"><b>findings</b><ul class="list">${a.findings.map(f=>`<li><span class="sev sev-${esc(f.severity)}">${esc(f.severity)}</span> <code>${esc(f.file)}</code> ${esc(f.issue)}</li>`).join('')}</ul></div>`:'<div class="small">no findings</div>'}

      <div class="grid" style="margin-top:6px"><div><b class="pass">checked</b><ul class="list">${(a.checked||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="small">reviewer listed nothing</li>'}</ul></div><div><b style="color:var(--warn)">not checked</b><ul class="list">${(a.not_checked||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="small">reviewer listed nothing — coverage unknown</li>'}</ul></div></div></div>`;
    case 'root_cause':return `<div class="art">${head}<div style="margin-top:4px"><b>${esc(a.root_cause?.statement)}</b> ${a.root_cause?.file?`<code>${esc(a.root_cause.file)}${a.root_cause.line?':'+a.root_cause.line:''}</code>`:''}</div><div class="small">agent-reported hypothesis — supported only when cross-checked against the diff and the test flip</div><details><summary>researcher summary</summary><pre>${esc(a.summary)}</pre></details></div>`;
  }
  return `<div class="art">${head}<pre>${esc(JSON.stringify(a,null,2))}</pre></div>`}

function renderTimeline(v,events){const t=v.task;const active=ACTIVE.has(t.status);
  const phases=events.filter(e=>e.type==='task.phase_changed').map(e=>e.data.to);const cur=t.status;

  const it=sig.map(e=>{const d=e.data||{};let txt='',cls='';switch(e.type){

    case 'tests.started':txt=d.replay_original_tests?`replaying ORIGINAL tests against the change (author edited ${d.replay_original_tests.length} test file(s))`:`running <code>${esc(d.command)}</code>${d.repeat>1?' (repeat '+d.repeat+')':''}`;break;case 'tests.passed':txt=`<code>${esc(d.command)}</code> passed`;cls='ok';break;case 'tests.failed':txt=`<code>${esc(d.command)}</code> FAILED (exit ${d.exit_code})`;cls='bad';break;case 'tests.skipped':txt='tests skipped: '+esc(d.reason);cls='bad';break;
    case 'review.started':txt='independent review started (different model, no author reasoning)';break;case 'review.finding':txt=`reviewer finding [${esc(d.severity)}] ${esc(d.issue)}`;cls=d.severity==='high'?'bad':'';break;case 'review.completed':txt=`review: <b>${esc(d.verdict)}</b> — ${esc(d.summary)}`;cls=d.verdict==='approve'?'ok':'bad';break;
    case 'decision.required':txt=`<b>paused — needs a human answer:</b> ${esc(d.question)}`;cls='bad';break;case 'decision.resolved':txt=`decision resolved: ${esc(d.option)} ${esc(d.note||'')}`;break;
    case 'task.completed':txt='workflow finished';cls='ok';break;case 'task.failed':txt='workflow FAILED: '+esc(d.reason);cls='bad';break;case 'task.interrupted':case 'task.cancelled':txt=(e.type==='task.cancelled'?'cancelled':'interrupted')+' during '+esc(d.was);cls='bad';break;case 'task.resumed':txt='resumed at '+esc(d.to);break;
    case 'packet.built':txt=`proof packet v${d.version} built: <b>${esc(d.verdict)}</b>, ${d.gaps} gap(s)`;break;case 'verdict.recorded':txt=`human decision recorded: <b>${esc(d.decision)}</b> on packet v${d.packet_version}`;cls='ok';break;case 'policy.violation':txt='<b>BLOCKED by execution policy:</b> '+esc(d.error);cls='bad';break;case 'warning':txt='warning: '+esc(d.warning);break;case 'task.phase_changed':txt=`phase → <b>${esc(d.to)}</b>`;break;

  ${t.status==='awaiting_decision'?'<div class="warnbox">The engine is waiting for a human answer — see the Proof packet tab.</div>':''}${t.status==='interrupted'?'<div class="warnbox">Interrupted (cancel or restart). Nothing after the interruption counts as verified; resume to continue from the last phase.</div>':''}
  <div style="margin:8px 0">${controls}</div>
  <div class="grid"><div><h2>Runs</h2><table><tr><th>role</th><th>model</th><th>duration</th><th>cost</th><th>status</th></tr>${v.runs.map(r=>`<tr><td>${esc(r.role)}</td><td>${esc(r.executor)}${r.model?'/'+esc(r.model):''}</td><td>${fmtMs(r.duration_ms)}</td><td>$${(r.cost_usd||0).toFixed(3)}</td><td>${esc(r.status)}</td></tr>`).join('')||'<tr><td colspan=5 class="small">none yet</td></tr>'}</table><div class="small" style="margin-top:6px">total ${fmtMs(v.totals.duration_ms)} · $${v.totals.cost_usd.toFixed(3)}</div></div>
  <div><h2>Commands</h2><table><tr><th>kind</th><th>command</th><th>result</th></tr>${v.artifacts.filter(a=>['baseline_run','test_run','original_tests_run'].includes(a.kind)).map(a=>`<tr><td>${esc(a.kind.replace('_',' '))}</td><td><code>${esc(a.command)}</code></td><td class="${a.passed&&!a.timed_out?'pass':'fail'}">${a.timed_out?'timeout':a.passed?'pass':'fail ('+a.exit_code+')'}</td></tr>`).join('')||'<tr><td colspan=3 class="small">none yet</td></tr>'}</table></div></div>
  <h2 style="margin-top:14px">Timeline</h2><div class="tl">${it||'<div class="small">no events</div>'}</div>`;
}
async function renderHistoryDiff(id,a,b){const [pa,pb]=await Promise.all([api(`/tasks/${id}/packet/versions/${a}`),api(`/tasks/${id}/packet/versions/${b}`)]);
  const rows=pb.claims.map(c=>{const o=(pa.claims||[]).find(x=>x.type===c.type);const ch=!o||o.status!==c.status;return `<tr><td>${esc(c.title)}</td><td><span class="badge b-${o?o.status:'insufficient'}">${o?o.status:'—'}</span></td><td><span class="badge b-${c.status}">${c.status}</span></td><td>${ch?'<b>changed</b>: '+esc(c.reason):''}</td></tr>`}).join('');
  $('#hdiff').innerHTML=`<table><tr><th>claim</th><th>v${a}</th><th>v${b}</th><th></th></tr>${rows}</table><div class="small" style="margin-top:6px">v${a}: ${esc(pa.verdict)} on ${esc(short(pa.source))} → v${b}: ${esc(pb.verdict)} on ${esc(short(pb.source))}</div>`}
const short=s=>Object.entries((s||{}).head_shas||{}).map(([r,x])=>r+'@'+x.slice(0,10)).join(',');
function renderHistory(v){const t=v.task;const vs=v.versions;
  return `<h2>Packet versions</h2><div class="small" style="margin-bottom:8px">A version is appended only when the packet content changes (fingerprint); old versions are never rewritten. A human decision is pinned to the version it was taken on.</div>
  <table><tr><th>v</th><th>verdict</th><th>workflow</th><th>built</th><th>fingerprint</th><th>decision</th><th></th></tr>${vs.map(x=>`<tr><td>${x.version}</td><td><span class="badge b-${x.verdict}">${x.verdict}</span></td><td>${esc(x.task_status)}</td><td class="small">${new Date(x.built_at).toLocaleString()}</td><td class="mono">${x.fingerprint}</td><td>${v.verdicts.filter(d=>d.packet_version===x.version).map(d=>'<b>'+esc(d.decision)+'</b>').join(', ')||''}</td><td><a href="/tasks/${t.id}/packet/versions/${x.version}" target="_blank">json</a></td></tr>`).join('')}</table>
  ${vs.length>1?`<div style="margin-top:12px"><h2>Compare</h2><select id="ha" onchange="cmp()">${vs.map(x=>`<option value="${x.version}" ${x.version===vs.length-1?'selected':''}>v${x.version}</option>`).join('')}</select> → <select id="hb" onchange="cmp()">${vs.map(x=>`<option value="${x.version}" ${x.version===vs.length?'selected':''}>v${x.version}</option>`).join('')}</select><div id="hdiff" style="margin-top:8px"></div></div><script>setTimeout(cmp,0)<\/script>`:''}`;
}
function cmp(){const id=location.pathname.split('/')[2];renderHistoryDiff(id,$('#ha').value,$('#hb').value)}
function renderRaw(v,events){return `<h2>Agent runs</h2><table><tr><th>run</th><th>role</th><th>phase</th><th>executor / model</th><th>route reason</th><th>status</th><th>summary</th></tr>${v.runs.map(r=>`<tr><td class="mono">${r.id}</td><td>${esc(r.role)}</td><td>${esc(r.phase)}</td><td>${esc(r.executor)} / ${esc(r.model||'')}</td><td class="small">${esc(r.route_reason||'')}</td><td>${esc(r.status)}${r.error?' — '+esc(r.error):''}</td><td class="small">${esc(r.summary||'')}</td></tr>`).join('')}</table>
  <h2 style="margin-top:14px">All artifacts (${v.artifacts.length})</h2>${v.artifacts.map(a=>renderArt(a)).join('')}
  <h2 style="margin-top:14px">Events (${events.length})</h2><table><tr><th>#</th><th>at</th><th>type</th><th>data</th></tr>${events.map(e=>`<tr><td>${e.seq}</td><td>${new Date(e.at).toLocaleTimeString()}</td><td><code>${esc(e.type)}</code></td><td class="mono small">${esc(JSON.stringify(e.data||{})).slice(0,400)}</td></tr>`).join('')}</table>
  <h2 style="margin-top:14px">Legacy evidence chain</h2><table>${v.evidence.map(e=>`<tr><td><code>${esc(e.level)}</code></td><td>${esc(e.claim)}</td><td class="mono">${esc(e.source)}</td></tr>`).join('')}</table>`}

function toggle(id){open[id]=!open[id];const el=document.getElementById('ev-'+id);if(el)el.classList.toggle('hidden',!open[id]);if(id.startsWith('c-'))route()}
async function decide(id,decision){const note=$('#note').value;try{await api('/tasks/'+id+'/verdict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,note,by:'ui',packet_version:window.__pv||0})});route()}catch(e){alert(e.message)}}
async function resolve(id,did,opt){const note=($('#dnote-'+did)||{}).value||'';try{await api('/tasks/'+id+'/decisions/'+did+'/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({option:opt,note})});go('/cases/'+id+'/timeline')}catch(e){alert(e.message)}}
async function postGitHub(id){const el=$('#effects');el.textContent='posting…';try{const r=await api('/tasks/'+id+'/github/post',{method:'POST'});el.innerHTML=(r.effects||[]).map(e=>`<div>${esc(e.kind)} → ${esc(e.target)}: <b>${esc(e.status)}</b> ${esc(e.detail||'')}</div>`).join('')||'no effects'}catch(e){el.innerHTML=`<span class="fail">${esc(e.message)}</span>`}}
async function cancelCase(id){try{await api('/tasks/'+id+'/cancel',{method:'POST'});route()}catch(e){alert(e.message)}}
async function reverifyCase(id){try{await api('/tasks/'+id+'/reverify',{method:'POST'});go('/cases/'+id+'/timeline')}catch(e){alert(e.message)}}
async function resumeCase(id){try{await api('/tasks/'+id+'/resume',{method:'POST'});route()}catch(e){alert(e.message)}}
async function runCase(id){try{await api('/tasks/'+id+'/run',{method:'POST'});route()}catch(e){alert(e.message)}}

// ---------- Repos & settings ----------
async function reposPage(){const repos=await api('/repos').catch(()=>[]);const s=SYS||{};
  $('#app').innerHTML=`<h1 class="page">Repositories &amp; settings</h1>${unsafeBox()}
  <div class="panel"><h2>Execution boundary</h2><div>mode <span class="modebadge ${s.exec_mode==='SAFE_SANDBOX'?'m-safe':'m-unsafe'}">${esc(s.exec_mode)}</span> · workspace <code>${esc(s.workspace_root)}</code> · repository roots ${(s.repos_roots||[]).length?(s.repos_roots||[]).map(r=>'<code>'+esc(r)+'</code>').join(' '):'<i>unrestricted</i>'}</div>
  <table style="margin-top:8px"><tr><th>capability</th><th>enforced</th><th>how</th></tr>${(s.capabilities||[]).map(c=>`<tr><td>${esc(c.name)}</td><td class="${c.enforced?'pass':'fail'}">${c.enforced?'yes':'NO'}</td><td class="small">${esc(c.how)}</td></tr>`).join('')}</table></div>
  <div class="panel"><h2>Integrations</h2><table><tr><td>GitHub API</td><td class="${s.github_connected?'pass':'fail'}">${s.github_connected?'connected':'not connected'}</td><td class="small">set GITHUB_TOKEN; PR import and status posting</td></tr><tr><td>GitHub webhook</td><td class="${s.webhook_configured?'pass':'fail'}">${s.webhook_configured?'configured':'not configured'}</td><td class="small">PROOFLINE_GITHUB_WEBHOOK_SECRET; POST /github/webhook</td></tr><tr><td>Integration runner</td><td class="pass">HTTP checks (per-repository policy)</td><td class="small">start command + checks; artifact bound to the SHA; cross-service stays INSUFFICIENT</td></tr><tr><td>LLM executors</td><td>${(s.executors||[]).map(e=>'<code>'+esc(e)+'</code>').join(' ')}</td><td class="small">"scenario" = Local Pilot scripted agents only</td></tr><tr><td>Authentication</td><td class="${s.auth_configured?'pass':'fail'}">${s.auth_configured?'configured':'local single-user mode'}</td><td class="small">orc auth init … (serve refuses non-loopback bind without it)</td></tr></table></div>
  <div class="panel"><h2>Repositories</h2><table><tr><th>id</th><th>name</th><th>path</th><th>github</th></tr>${repos.map(r=>`<tr><td class="mono">${r.id}</td><td>${esc(r.name)}</td><td class="mono small">${esc(r.path)}</td><td>${esc(r.github||'')}</td></tr>`).join('')||'<tr><td colspan=4 class="small">none registered</td></tr>'}</table>
  <form style="margin-top:10px;display:flex;gap:8px" onsubmit="return addRepo(event)"><input type="text" name="path" placeholder="/absolute/path/to/git/repo" required><button type="submit">Register</button></form><div class="small" style="margin-top:4px">Paths are canonicalised; symlinks/escapes, repositories inside the workspace and (in SAFE_SANDBOX) paths outside the roots are refused.</div><div id="repoerr"></div></div>`;
}
async function addRepo(ev){ev.preventDefault();try{await api('/repos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:ev.target.path.value})});route()}catch(e){$('#repoerr').innerHTML=`<div class="err">${esc(e.message)}</div>`}return false}

async function auditPage(){const rows=await api('/audit');$('#app').innerHTML=`<h1 class="page">Audit log</h1><div class="panel"><div class="small" style="margin-bottom:6px">Sensitive actions: case creation, cancel, re-verify, engine decisions, human verdicts, repository registration/policy, GitHub posts. Visible to workspace admins/owners.</div><table><tr><th>at</th><th>actor</th><th>action</th><th>resource</th><th>detail</th></tr>${rows.slice().reverse().map(a=>`<tr><td class="small">${new Date(a.at).toLocaleString()}</td><td>${esc(a.actor)}</td><td><code>${esc(a.action)}</code></td><td class="mono">${esc(a.resource)}</td><td class="small">${esc(a.detail||'')}</td></tr>`).join('')||'<tr><td colspan=5 class="small">nothing yet</td></tr>'}</table></div>`}

// ---------- Help ----------
function help(){$('#app').innerHTML=`<h1 class="page">What a Proofline packet means</h1>
<div class="panel"><h2>The question</h2><p>Can this specific change be trusted, and what exactly proves it? Proofline answers with <b>claims</b>, each decided by an explicit policy over persisted <b>evidence artifacts</b> bound to an exact source state. Agent text is never evidence.</p></div>
<div class="panel"><h2>Statuses</h2><table>
<tr><td><span class="badge b-supported">supported</span></td><td>The claim's policy is met by artifacts observed on the <i>current</i> code. It does not mean "safe in every sense" — read the gaps.</td></tr>
<tr><td><span class="badge b-insufficient">insufficient</span></td><td>No artifact proves it: not checked, not configured, or not provable (e.g. tests pass but nothing failed on the baseline). This is information, not an error.</td></tr>
<tr><td><span class="badge b-stale">stale</span></td><td>Evidence exists but was observed on an earlier revision or with uncommitted changes. Re-verify before deciding.</td></tr>
<tr><td><span class="badge b-contradicted">contradicted</span></td><td>An artifact says the opposite: a failing run, a flaky pair, original tests failing against the change, a reviewer counterexample.</td></tr>
<tr><td><span class="badge b-blocked">blocked</span></td><td>Packet verdict when a core claim is contradicted or the execution policy stopped the task. No merge decision should rest on it.</td></tr></table></div>
<div class="panel"><h2>Core claims and their policies</h2><ul class="list"><li><b>Problem reproduced</b> — the reproduction command fails on the unchanged code with a named failing test.</li><li><b>Root cause supported</b> — a cross-check only: hypothesis names a real file, the fix touches it, the reproduction flipped.</li><li><b>Change verified</b> — same command base→current: fail→pass, tests actually executed, complete output, repeats agree, original tests still pass if the author edited tests.</li><li><b>Independent challenge</b> — a different model, without the author's reasoning, states what it checked and finds no counterexample. Absence of a counterexample is not proof of correctness.</li><li><b>Integration / cross-service</b> — INSUFFICIENT until a runner is configured. Shown loudly on purpose.</li></ul></div>
<div class="panel"><h2>Human decision</h2><p>Accept / request changes / reject are recorded separately from any verdict and pinned to the packet version you saw. If the code or evidence changes, the old decision is shown as belonging to the old version and a new one is required.</p></div>
<div class="panel"><h2>Local Pilot vs GitHub</h2><p><b>Local Pilot</b> runs on repositories on this machine; examples use scripted agents on a real bug so the whole path is reproducible offline. <b>GitHub</b> mode imports a PR by exact base/head SHA and never posts a fake approval; it shows "not connected" until credentials exist.</p></div>`}
route();
</script>
</body></html>
